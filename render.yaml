services:
  - type: web
    name: gent-api
    env: docker
    region: oregon
    plan: free
    dockerContext: apps/server/gent_api
    dockerfilePath: apps/server/gent_api/Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: gent-db
          property: connectionString
      # Resend (https://resend.com) is the email API - unrelated to Render.
      # sync: false means this must be set by hand in the Render dashboard
      # (Environment tab). Password reset emails will not send without it.
      - key: RESEND_API_KEY
        sync: false
      # Resend's shared sender; only delivers to the address the Resend account
      # was registered with. Swap for an address on a verified domain to reach
      # arbitrary recipients.
      - key: DEFAULT_FROM_EMAIL
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        value: https://gent-nu2e.onrender.com
      - key: PASSWORD_RESET_TIMEOUT
        value: "3600"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: gent-db
    databaseName: gent_api
    user: gent_user
    plan: free
    ipAllowList: []
